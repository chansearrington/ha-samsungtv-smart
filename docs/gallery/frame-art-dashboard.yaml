title: Frame Art
views:
- title: Living Room
  path: living-room
  icon: mdi:sofa
  cards:
  - type: markdown
    content: '## Living Room Frame

      Tap a thumbnail below to display it on the Frame. Long-press to preview it full-screen.'
  - type: horizontal-stack
    cards:
    - type: button
      name: Art Mode
      icon: mdi:palette
      tap_action:
        action: call-service
        service: samsungtv_smart.art_set_artmode
        target:
          entity_id: media_player.living_room_tv
        data:
          enabled: true
    - type: button
      name: Bright
      icon: mdi:brightness-7
      tap_action:
        action: call-service
        service: samsungtv_smart.art_set_brightness
        target:
          entity_id: media_player.living_room_tv
        data:
          brightness: 80
    - type: button
      name: Dim
      icon: mdi:brightness-4
      tap_action:
        action: call-service
        service: samsungtv_smart.art_set_brightness
        target:
          entity_id: media_player.living_room_tv
        data:
          brightness: 30
  - type: custom:folder-gallery-card
    title: Tap to display on Frame
    frame_tv_entity: media_player.living_room_tv
    tv_entity: media_player.living_room_tv
    columns: 4
    image_height: 180px
    gap: 10px
    border_radius: 12px
    show_filename: false
    server_thumbnails: true
    thumbnail_width: 400
    image_list:
    - /local/frame_art/01KD6Q3F8QV03CNAFZT7DWPY6P/personal/MY_F0014.jpg
    - /local/frame_art/01KD6Q3F8QV03CNAFZT7DWPY6P/personal/MY_F0016.jpg
    - /local/frame_art/01KD6Q3F8QV03CNAFZT7DWPY6P/personal/MY_F0017.jpg
    - /local/frame_art/01KD6Q3F8QV03CNAFZT7DWPY6P/personal/MY_F0023.jpg
    - /local/frame_art/01KD6Q3F8QV03CNAFZT7DWPY6P/store/SAM-S10001061.jpg
    tap_action: action
    action:
      service: samsungtv_smart.art_select_image
      target:
        entity_id: media_player.living_room_tv
      data:
        content_id: '{{content_id}}'
        show: true
    hold_action: lightbox
