    - type: button
      name: Bright
      icon: mdi:brightness-7
      tap_action:
        action: call-service
        service: samsungtv_smart.art_set_brightness
        target:
          entity_id: media_player.kitchen_smartthings_hub
        data:
          brightness: 80
    - type: button
      name: Dim
      icon: mdi:brightness-4
      tap_action:
        action: call-service
        service: samsungtv_smart.art_set_brightness
        target:
          entity_id: media_player.kitchen_smartthings_hub
        data:
          brightness: 30
  - type: custom:folder-gallery-card
    title: Tap to display on Frame
    frame_tv_entity: media_player.kitchen_smartthings_hub
    tv_entity: media_player.kitchen_smartthings_hub
